name: Import Food Hub RC9

on:
  push:
    branches: ["develop/foodhub-rc9"]
    paths:
      - ".bootstrap/rc9.ready"

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop/foodhub-rc9
          fetch-depth: 0

      - name: Rebuild RC9 archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/rc9zip.part.*.b64 > /tmp/rc9.b64
          base64 --decode /tmp/rc9.b64 > /tmp/rc9.zip
          echo "ec01ccef0f31ce64f4e43199dc5d8ad33c7ebda584c92c82b7ea6fdd37ac5e46  /tmp/rc9.zip" | sha256sum -c -
          rm -rf /tmp/rc9
          mkdir -p /tmp/rc9
          unzip -q /tmp/rc9.zip -d /tmp/rc9

      - name: Validate source package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=/tmp/rc9/takatak-accounting-control-tower-final
          test -d "$SOURCE"
          test "$(find "$SOURCE" -type f | wc -l | tr -d ' ')" = "237"
          test "$(node -p "require('$SOURCE/package.json').version")" = "1.4.0-foodhub-rc9"
          if find "$SOURCE" -type f \( -name ".env" -o -name ".env.local" -o -name "*.pem" -o -name "id_rsa" \) | grep -q .; then
            echo "Unsafe secret-bearing filename detected"
            exit 1
          fi
          if grep -RIE --exclude='package-lock.json' --exclude='.env.example'             'BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY|sk_live_|sk_test_|ghp_|github_pat_|AKIA[0-9A-Z]{16}' "$SOURCE"; then
            echo "Potential secret detected"
            exit 1
          fi

      - name: Import RC9 source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=/tmp/rc9/takatak-accounting-control-tower-final

          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name ".github"             ! -name ".bootstrap"             -exec rm -rf {} +

          cp -a "$SOURCE"/. .

          cat > .gitignore <<'EOF'
          # dependencies
          node_modules/

          # Next.js
          .next/
          out/

          # local environment / secrets
          .env
          .env.*
          !.env.example

          # logs
          *.log
          npm-debug.log*
          yarn-debug.log*
          yarn-error.log*
          pnpm-debug.log*

          # tests / coverage
          coverage/

          # OS / editors
          .DS_Store
          Thumbs.db
          .vscode/
          .idea/

          # Vercel
          .vercel/

          # TypeScript
          *.tsbuildinfo
          EOF

          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-rc9.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import TAKATAK Food Hub RC9 baseline"
          git push origin HEAD:develop/foodhub-rc9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Release readiness
        run: npm run release:check
        env:
          LIVE_CONNECTORS_GLOBAL_ENABLED: "false"

      - name: Food Hub verification
        run: npm run verify:foodhub
        env:
          LIVE_CONNECTORS_GLOBAL_ENABLED: "false"
