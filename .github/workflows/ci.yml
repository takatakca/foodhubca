name: Food Hub CI

on:
  push:
    branches: [main, "develop/**", "claude/**"]
  pull_request:
    # release/**: the owner's release branches collect several PRs before one review (e.g. release/2026-10-30).
    branches: [main, "develop/**", "release/**"]

permissions:
  contents: read

concurrency:
  group: foodhub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Production dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        id: build
        run: npm run build
      # Accessibility (MASTER PLAN Phase 3, docs/ACCESSIBILITY.md): axe-core, WCAG 2.1 A/AA, phone + desktop, reduced
      # motion. Chromium's headless shell only, cached per Playwright version; the system libraries come from apt.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium (headless shell) and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Chromium system libraries (browser restored from the cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Accessibility check (axe-core, WCAG 2.1 AA)
        timeout-minutes: 8
        run: npm run verify:a11y
      - name: Food Hub verification
        # Runs even when the accessibility check failed: the two report different things.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run verify:foodhub
        env:
          LIVE_CONNECTORS_GLOBAL_ENABLED: "false"
