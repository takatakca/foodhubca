name: Android kitchen tablet

# Builds the Food Hub kitchen tablet app (apps/kitchen-tablet) into foodhub-tablet.apk:
#   - every push to the app's branch or to main (when apps/kitchen-tablet changes): unit tests + APK, kept as a
#     workflow artifact for 30 days (Actions → this run → Artifacts);
#   - a tag tablet-v<version> (or « Run workflow » with a version): the same, plus a GitHub Release that carries
#     foodhub-tablet.apk — the file the /tablette page links to.
# Signing: with the four repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD, the release build is signed with the owner's key (updates install over the previous version).
# Without them the same release build is signed with the runner's own debug key: never android:debuggable (no
# `adb run-as` copy of a kitchen tablet's cookies), it installs fine, but each new version must be installed after
# uninstalling the old one (every runner makes its own debug key). No keystore is ever generated or committed here.

on:
  push:
    branches: [main, feature/kitchen-tablet-app]
    tags: ["tablet-v*"]
    paths: ["apps/kitchen-tablet/**", ".github/workflows/android-tablet.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this version (e.g. 1.0.0). Leave empty to build only."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-tablet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub Release on a tag / a dispatched version
    defaults:
      run:
        working-directory: apps/kitchen-tablet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the Gradle wrapper is the official one
        uses: gradle/actions/wrapper-validation@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eu
          release=0
          if [[ "$GITHUB_REF" == refs/tags/tablet-v* ]]; then
            version="${GITHUB_REF#refs/tags/tablet-v}"; release=1
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            version="$INPUT_VERSION"; release=1
          else
            version="0.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          if [[ ! "$version" =~ ^[0-9A-Za-z.+-]{1,40}$ ]]; then echo "::error::Bad version '$version'"; exit 1; fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version (release: $release)"

      - name: Signing key (only when the owner added the secrets)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/foodhub-tablet.jks"
            echo "file=$RUNNER_TEMP/foodhub-tablet.jks" >> "$GITHUB_OUTPUT"
            echo "signed=1" >> "$GITHUB_OUTPUT"
            echo "Release build, signed with the owner's key."
          else
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret: release build signed with the runner's debug key (uninstall the old version before installing a new one)."
          fi

      - name: Unit tests and APK
        env:
          FOODHUB_TABLET_VERSION: ${{ steps.v.outputs.name }}
          FOODHUB_TABLET_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ steps.sign.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          chmod +x gradlew
          # Always the release build type (not debuggable); app/build.gradle.kts signs it with the owner's key when the
          # secrets are there, with the runner's debug key otherwise.
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          # Proof in the log: the published APK is not debuggable.
          aapt="$(ls "${ANDROID_HOME:-/nonexistent}"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$aapt" ]; then
            badging="$("$aapt" dump badging "$apk")"
            case "$badging" in *application-debuggable*) echo "::error::The APK is debuggable"; exit 1 ;; esac
            echo "APK is not debuggable (aapt dump badging)."
          fi
          mkdir -p dist
          cp "$apk" dist/foodhub-tablet.apk
          (cd dist && sha256sum foodhub-tablet.apk > foodhub-tablet.apk.sha256)
          ls -l dist
          cat dist/foodhub-tablet.apk.sha256

      - name: Keep the APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: foodhub-tablet-${{ steps.v.outputs.name }}
          path: |
            apps/kitchen-tablet/dist/foodhub-tablet.apk
            apps/kitchen-tablet/dist/foodhub-tablet.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Unit test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tablet-test-report
          path: apps/kitchen-tablet/app/build/reports/tests/
          if-no-files-found: ignore

      - name: GitHub Release with foodhub-tablet.apk
        if: steps.v.outputs.release == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tablet-v${{ steps.v.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Food Hub tablette cuisine ${{ steps.v.outputs.name }}
          make_latest: "true"
          files: |
            apps/kitchen-tablet/dist/foodhub-tablet.apk
            apps/kitchen-tablet/dist/foodhub-tablet.apk.sha256
          body: |
            Application tablette cuisine Food Hub · Food Hub kitchen tablet app — ${{ steps.v.outputs.name }}
            Installer / Install: https://foodhub.on2go.ca/tablette
            Signature: ${{ steps.sign.outputs.signed == '1' && 'release key' || 'build key of this run, not the release key (uninstall the previous version first)' }}
