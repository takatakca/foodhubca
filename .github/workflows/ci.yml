name: Food Hub CI

on:
  push:
    branches: [main, "develop/**"]
    paths-ignore:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-rc9.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Release readiness
        run: npm run release:check
        env:
          LIVE_CONNECTORS_GLOBAL_ENABLED: "false"
      - name: Food Hub verification
        run: npm run verify:foodhub
        env:
          LIVE_CONNECTORS_GLOBAL_ENABLED: "false"
