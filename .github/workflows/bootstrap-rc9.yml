name: Bootstrap Food Hub RC9

on:
  push:
    branches:
      - develop/foodhub-rc9
    paths:
      - ".github/workflows/bootstrap-rc9.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-foodhub-rc9
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: develop/foodhub-rc9
          fetch-depth: 0

      - name: Reconstruct and verify RC9 archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap -maxdepth 1 -name 'rc9.part.*.b64' -type f | wc -l | tr -d ' ')" = "27"
          cat .bootstrap/rc9.part.*.b64 > /tmp/foodhub-rc9.b64
          test "$(wc -c < /tmp/foodhub-rc9.b64 | tr -d ' ')" = "528400"
          base64 --decode /tmp/foodhub-rc9.b64 > /tmp/foodhub-rc9.tar.gz
          echo "6c8fe5c83f1cd7a1315b9daceff6f2fe3ee69ebcdf56cc295286d796382ac6c3  /tmp/foodhub-rc9.tar.gz" | sha256sum --check --strict

      - name: Validate RC9 source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/foodhub-rc9-src
          tar -xzf /tmp/foodhub-rc9.tar.gz -C /tmp/foodhub-rc9-src
          SOURCE="/tmp/foodhub-rc9-src/takatak-accounting-control-tower-final"
          test -f "$SOURCE/package.json"
          test -f "$SOURCE/package-lock.json"
          test "$(find "$SOURCE" -type f | wc -l | tr -d ' ')" = "237"
          test "$(node -p "require('$SOURCE/package.json').version")" = "1.4.0-foodhub-rc9"
          if find "$SOURCE" -type f \( -name ".env" -o -name ".env.local" -o -name "*.pem" -o -name "id_rsa" \) | grep -q .; then
            echo "Unsafe secret-bearing filename detected"
            exit 1
          fi
          if grep -RIE --exclude='package-lock.json' --exclude='.env.example'             'BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY|sk_live_|ghp_|github_pat_|AKIA[0-9A-Z]{16}' "$SOURCE"; then
            echo "Potential secret detected"
            exit 1
          fi

      - name: Import RC9 source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="/tmp/foodhub-rc9-src/takatak-accounting-control-tower-final"
          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name ".github"             ! -name ".bootstrap"             ! -name ".gitignore"             -exec rm -rf {} +
          cp -a "$SOURCE"/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-rc9.yml

      - name: Commit verified RC9 baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          test -n "$(git status --porcelain)"
          git commit -m "feat: import TAKATAK Food Hub RC9 baseline"
          git push origin HEAD:develop/foodhub-rc9
